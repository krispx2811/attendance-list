name: Build Windows app

# Pushing a version tag builds the installer and portable .exe and publishes
# them as a Release, which is also the feed electron-updater reads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # xvfb because the runner spawns Electron's binary as its Node host.
        run: xvfb-run --auto-servernum npm test

  build:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Verify the artifacts
        shell: pwsh
        run: |
          $portable = "dist/Al araimi.exe"
          $setup = Get-ChildItem dist -Filter "Al araimi-Setup-*.exe" | Select-Object -First 1
          if (-not (Test-Path $portable)) { throw "portable exe was not produced" }
          if (-not $setup) { throw "installer was not produced" }
          "{0}: {1:N1} MB" -f $portable, ((Get-Item $portable).Length / 1MB)
          "{0}: {1:N1} MB" -f $setup.Name, ($setup.Length / 1MB)
          if ((Get-Item $portable).Length -lt 40MB) { throw "portable exe is suspiciously small" }

      - name: Smoke-test the portable exe
        shell: pwsh
        run: |
          # Launch it briefly. Catches a missing native module or a renderer
          # that throws on boot — failures that otherwise only show up on the
          # user's machine.
          $env:ATTENDANCE_DATA_DIR = "$env:RUNNER_TEMP\attendance-smoke"
          $proc = Start-Process -FilePath "dist/Al araimi.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($proc.HasExited) { throw "the app exited early with code $($proc.ExitCode)" }
          Get-Process -Name "Al araimi" -ErrorAction SilentlyContinue | Stop-Process -Force
          $db = "$env:ATTENDANCE_DATA_DIR\attendance.db"
          if (-not (Test-Path $db)) { throw "the app did not create its database" }
          Write-Host "Smoke test passed: the window stayed open and the database was created."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceList-windows
          path: |
            dist/Al araimi.exe
            dist/Al araimi-Setup-*.exe
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Al araimi.exe
            dist/Al araimi-Setup-*.exe
            dist/latest.yml
          generate_release_notes: true
          body: |
            ## Attendance List ${{ github.ref_name }}

            **Most people want `Al araimi-Setup-${{ github.ref_name }}.exe`** —
            the installer. It adds a Start menu and desktop shortcut, and lets the
            app update itself from then on.

            `Al araimi.exe` is the portable version: one file, no install,
            keeps its data in a `data` folder beside itself. Good for a USB stick.

            Windows shows a "Windows protected your PC" warning because the app is
            not code-signed — click **More info** then **Run anyway**.

            If you already have an older version installed you do not need this
            page: the app offers the update itself the next time you open it.
