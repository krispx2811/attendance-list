<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <title>Attendance List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Attendance</span>
            <span class="brand-version" id="version-label"></span>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item is-active" data-view="today">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
            <span>Today</span>
          </button>
          <button class="nav-item" data-view="people">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Employees</span>
          </button>
          <button class="nav-item" data-view="history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v5h5" />
              <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" />
              <path d="M12 7v5l4 2" />
            </svg>
            <span>History</span>
          </button>
          <button class="nav-item" data-view="reports">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18" />
              <path d="M7 15l3.5-3.5 3 3L20 8" />
            </svg>
            <span>Reports</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="theme-switch" id="theme-switch" role="group" aria-label="Appearance">
            <button data-theme="system" class="is-active" title="Match system">Auto</button>
            <button data-theme="light" title="Light">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round"><circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
            <button data-theme="dark" title="Dark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </button>
          </div>
          <button class="link-btn" id="open-folder">Open data folder</button>
        </div>
      </aside>

      <main class="main">
        <div id="update-banner" class="update-banner" hidden>
          <span class="update-dot"></span>
          <div class="update-text">
            <strong id="update-title">Update available</strong>
            <span id="update-sub"></span>
          </div>
          <div class="update-actions">
            <button class="btn btn-sm btn-primary" id="update-action">Update</button>
            <button class="btn btn-sm btn-ghost" id="update-dismiss">Later</button>
          </div>
        </div>

        <div id="views"></div>
      </main>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <div class="modal-root" id="modal-root" hidden></div>

    <script src="views.js"></script>
    <script src="app.js"></script>
  </body>
</html>
